apiVersion: v1
kind: ServiceAccount
metadata:
  name: nita-traefik
  namespace: nita
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nita-traefik
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nita-traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nita-traefik
subjects:
  - kind: ServiceAccount
    name: nita-traefik
    namespace: nita
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nita-traefik
  namespace: nita
rules:
  - apiGroups: [""]
    resources: ["services", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nita-traefik
  namespace: nita
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nita-traefik
subjects:
  - kind: ServiceAccount
    name: nita-traefik
    namespace: nita
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nita-traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nita-webapp-https
  namespace: nita
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: bodylimit@file
spec:
  ingressClassName: nita-traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nita-jenkins-https
  namespace: nita
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: bodylimit@file,jenkins-slash@file,jenkins-headers@file,jenkins-auth@file,jenkins-identity@file
spec:
  ingressClassName: nita-traefik
  rules:
    - http:
        paths:
          - path: /jenkins
            pathType: Prefix
            backend:
              service:
                name: jenkins
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nita-webapp-http
  namespace: nita
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: bodylimit@file
spec:
  ingressClassName: nita-traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nita-jenkins-http
  namespace: nita
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: bodylimit@file,jenkins-slash@file,jenkins-headers@file,jenkins-auth@file,jenkins-identity@file
spec:
  ingressClassName: nita-traefik
  rules:
    - http:
        paths:
          - path: /jenkins
            pathType: Prefix
            backend:
              service:
                name: jenkins
                port:
                  number: 8080
