apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: nita
  labels:
    io.kompose.service: proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      io.kompose.service: proxy
  template:
    metadata:
      labels:
        io.kompose.network/nita-network: "true"
        io.kompose.service: proxy
    spec:
      serviceAccountName: nita-traefik
      containers:
        - name: proxy
          image: traefik:v3.7.19
          workingDir: /
          ports:
            - containerPort: 443
              hostPort: 443
              protocol: TCP
            - containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              port: 8082
              path: /ping
            periodSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /etc/traefik
              readOnly: true
            - name: bodylimit
              mountPath: /plugins-local/src/github.com/Juniper/nita-webapp/traefik/bodylimit
              readOnly: true
            - name: identityguard
              mountPath: /plugins-local/src/github.com/Juniper/nita-webapp/traefik/identityguard
              readOnly: true
            - name: certificate
              mountPath: /etc/certificate
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: nita-traefik-config
        - name: bodylimit
          configMap:
            name: nita-traefik-bodylimit
        - name: identityguard
          configMap:
            name: nita-traefik-identityguard
        - name: certificate
          secret:
            secretName: nita-traefik-tls
