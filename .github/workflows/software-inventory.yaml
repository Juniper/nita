name: Software Inventory

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  inventory:
    name: Validate source inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source-sha: ${{ steps.identity.outputs.sha }}
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements-inventory.txt

      - name: Run inventory and existing regression tests
        run: python -m unittest tests.test_software_inventory tests.test_installer_regression -v

      - name: Generate and validate evidence
        id: identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            args+=(--release-tag "$RELEASE_TAG")
          fi
          python tools/inventory.py --output dist/inventory "${args[@]}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nita-source-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/inventory/
          if-no-files-found: error
          retention-days: 90

      - name: Summarize coverage
        run: |
          {
            echo "## Source inventory"
            echo
            echo "Validated CycloneDX 1.7 pre-build inventory, readable manifest, and SHA-256 checksums."
            echo "Download the nita-source-inventory artifact from this run."
            echo "Direct declarations only; unresolved versions and licenses remain explicit."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Attach upstream release evidence
    needs: inventory
    if: >-
      github.repository == 'Juniper/nita' &&
      github.event_name == 'release' &&
      github.event.action == 'published'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: nita-inventory-release-${{ github.event.release.id }}
      cancel-in-progress: false
    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.inventory.outputs.source-sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements-inventory.txt

      - name: Download evidence from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nita-source-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/inventory/

      - name: Publish without replacing existing evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SOURCE_SHA: ${{ needs.inventory.outputs.source-sha }}
        run: |
          python tools/publish_inventory.py \
            --directory dist/inventory \
            --tag "$RELEASE_TAG" \
            --commit "$SOURCE_SHA"
